<nav class="primary-nav" aria-label="Primary">
  {# Safari drops list semantics when list-style is none; role="list" restores them. #}
  <ul class="primary-nav__list" role="list">
    {% for link in links %}
      <li><a class="primary-nav__link" href="{{ link.url }}"{% if link.aria_current %} aria-current="{{ link.aria_current }}"{% endif %}>{% include "includes/nav_icon.html" with icon=link.icon %}<span class="primary-nav__label">{{ link.label }}</span></a></li>
    {% endfor %}
  </ul>
</nav>
