# Local services.
#   docker compose up -d db                  PostgreSQL for development
#   docker compose --profile app up --build  also runs the production image locally

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned folder under this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgres://site:site@db:5432/site
      DJANGO_SECRET_KEY: local-compose-only-not-a-real-secret-0123456789abcdefghij
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_ADMIN_URL: manage/
      # No TLS locally.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      SITE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
