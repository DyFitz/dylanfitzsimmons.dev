name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Django's deployment checks against the production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_READ_DOT_ENV: "false"
          DJANGO_ALLOWED_HOSTS: dylanfitzsimmons.dev
          DJANGO_ADMIN_URL: ci-admin/
          DATABASE_URL: "sqlite://:memory:"
          SITE_URL: https://dylanfitzsimmons.dev
        run: |
          DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DJANGO_SECRET_KEY
          uv run python manage.py check --deploy --fail-level WARNING

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: site
          POSTGRES_USER: site
          POSTGRES_PASSWORD: site
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U site -d site"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://site:site@localhost:5432/site
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests against PostgreSQL
        run: uv run pytest --cov --cov-report=term-missing

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
