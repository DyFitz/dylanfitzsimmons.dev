[project]
name = "dylanfitzsimmons-dev"
version = "0.1.0"
description = "Personal site: coding projects, CV, investment portfolio and a contact form."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Dylan Fitzsimmons" }]
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.12",
    "django-otp>=1.6",
    "gunicorn>=23.0",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
    "pygments>=2.21.0",
    "qrcode>=8.0",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-django>=4.13",
    "ruff>=0.17",
]

[tool.uv]
# An app, not a package, so uv only installs the dependencies.
package = false

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming conventions
    "UP",   # modern Python syntax
    "B",    # likely bugs
    "S",    # security (bandit)
    "DJ",   # Django conventions
    "DTZ",  # timezone-naive datetimes
    "C4",   # comprehensions
    "PT",   # pytest style
    "RET",  # return statements
    "SIM",  # simplifications
    "PTH",  # pathlib over os.path
    "T20",  # stray print statements
    "RUF",  # Ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# Settings modules extend base.py with star imports.
"config/settings/*.py" = ["F403", "F405"]
# Asserts, dummy secrets and subprocess calls are fine in tests.
"**/tests/**" = ["S101", "S105", "S106", "S603"]
# Binding to 0.0.0.0 and using /dev/shm are intended inside the container.
"gunicorn.conf.py" = ["N999", "S104", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps"]
python_files = ["test_*.py"]
addopts = "--strict-config --strict-markers -ra"

[tool.coverage.run]
branch = true
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
