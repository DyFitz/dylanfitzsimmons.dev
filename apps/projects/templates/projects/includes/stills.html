{% comment %}The still drawing of each kind of project, shown on the desk's screens when the project's live
   preview isn't running. `on` names what the desk's script is showing: the current project,
   a row in a list, or a slide.
{% endcomment %}<template data-if="{{ on }}.isSite">
<svg class="screen__still still" viewBox="0 0 240 150" aria-hidden="true" focusable="false">
<g class="art-outline">
<rect x="10" y="10" width="220" height="130" rx="6"></rect>
<path d="M10 30H230"></path>
<circle cx="24" cy="20" r="3"></circle>
<circle cx="36" cy="20" r="3"></circle>
<circle cx="48" cy="20" r="3"></circle>
<rect x="28" y="86" width="56" height="38"></rect>
<rect x="92" y="86" width="56" height="38"></rect>
<rect x="156" y="86" width="56" height="38"></rect>
</g>
<g class="art-globe">
<circle cx="186" cy="58" r="19"></circle>
<ellipse cx="186" cy="58" rx="13.4" ry="19"></ellipse>
<path d="M186 39V77M169.5 48.5H202.5M167 58H205M169.5 67.5H202.5"></path>
</g>
<path class="art-bars" d="M28 52H140M28 64H110"></path>
</svg>
</template>
<template data-if="{{ on }}.isForecast">
<svg class="screen__still still" viewBox="0 0 240 150" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="forecast-shade" x1="0" y1="30" x2="0" y2="135" gradientUnits="userSpaceOnUse">
<stop class="art-shade-start" offset="0"></stop>
<stop class="art-shade-end" offset="1"></stop>
</linearGradient>
</defs>
<path class="art-grid" d="M10 30H230M10 65H230M10 100H230"></path>
<path class="art-axis" d="M10 135H230"></path>
<path class="art-now" d="M150 14V135"></path>
<path class="art-shade" fill="url(#forecast-shade)" d="M10 135V116L22 110L34 114L46 102L58 106L70 96L82 100L94 90L106 94L118 84L130 88L142 76L150 78V135Z"></path>
<path class="art-cone" d="M150 78L160 65.9L170 60L180 55.1L190 50.8L200 46.8L210 43L220 39.4L230 36L230 96L220 95.6L210 95L200 94.2L190 93.2L180 91.9L170 90L160 87.1L150 78Z"></path>
<polyline class="art-series" points="10,116 22,110 34,114 46,102 58,106 70,96 82,100 94,90 106,94 118,84 130,88 142,76 150,78"></polyline>
<polyline class="art-forecast" points="150,78 230,66"></polyline>
<circle class="art-point" cx="150" cy="78" r="3.5"></circle>
</svg>
</template>
<template data-if="{{ on }}.isBacktest">
<svg class="screen__still still" viewBox="0 0 240 150" aria-hidden="true" focusable="false">
<path class="art-grid" d="M6 28H234M6 64H234M6 100H234"></path>
<path class="art-axis" d="M6 138H234"></path>
<polyline class="art-price" points="6,96 18,90 30,100 42,86 54,88 66,70 78,78 90,94 102,86 114,72 126,76 138,58 150,66 162,82 174,74 186,56 198,62 210,46 222,52 234,40"></polyline>
<path class="art-equity-area" d="M6 132L30 131L54 128L78 124L102 125L126 120L150 117L174 118L198 113L222 109L234 107V138H6Z"></path>
<polyline class="art-series" points="6,132 30,131 54,128 78,124 102,125 126,120 150,117 174,118 198,113 222,109 234,107"></polyline>
<path class="art-buy" d="M30 105L35 113H25ZM90 99L95 107H85ZM162 87L167 95H157Z"></path>
<path class="art-sell" d="M66 65L71 57H61ZM138 53L143 45H133ZM210 41L215 33H205Z"></path>
</svg>
</template>
