{# The room and its three monitors. Filled in by static/js/modules/template.js, so the braces are its, not Django's. #}
{% verbatim %}
<div class="room room--wire room--pull room--cyber room--y2k" data-ref="roomRef" data-style="{{fit}}" data-zoom="{{zoom}}" data-power="{{power}}">
<div class="room__backdrop" aria-hidden="true">
<div class="room__rain" aria-hidden="true"><canvas></canvas></div>
<svg class="room__wire" viewBox="-3200 -1900 9800 6600" aria-hidden="true" focusable="false"><g class="room__globe"><circle cx="1700" cy="800" r="1040"></circle><ellipse cx="1700" cy="800" rx="300" ry="1040"></ellipse><ellipse cx="1700" cy="800" rx="620" ry="1040"></ellipse><ellipse cx="1700" cy="800" rx="880" ry="1040"></ellipse><path d="M1012 20H2388"></path><path d="M800 280H2600"></path><path d="M693 540H2707"></path><path d="M660 800H2740"></path><path d="M693 1060H2707"></path><path d="M800 1320H2600"></path><path d="M1012 1580H2388"></path><ellipse cx="1700" cy="800" rx="1420" ry="330" transform="rotate(-16 1700 800)"></ellipse></g></svg>
<div class="room__floor"><div class="room__grid"></div></div>
</div>
<div class="room__camera">
<span class="room__surface" aria-hidden="true"></span>
<span class="room__glow" aria-hidden="true"></span>
<div class="stage" data-phase="{{phase}}">
<template data-if="isW95">
<div class="pm pm--crt pm--tube" data-power="{{power}}" data-signal="{{signal}}" data-style="{{levels}}">
<div class="pm__body">
<img class="pm__photo" src="{{images.crt}}" alt="" width="1110" height="949" draggable="false">
<div class="pm__screen ">
<div class="pm__picture">
<div class="pm__level">
<div class="pm__jolt">
<div class="w95">
{% endverbatim %}{% include "projects/includes/w95_icons.html" %}{% verbatim %}
<template data-each="icons" data-as="icon"><a class="{{icon.cls}}" href="{{icon.href}}" draggable="false" data-style="{{icon.place}}" data-on-pointerdown="icon.drag" data-on-click="icon.press"><template data-if="icon.isHome"><svg class="desk-icon__art" aria-hidden="true" focusable="false"><use href="#ico-home"></use></svg></template><template data-if="icon.isProjects"><svg class="desk-icon__art" aria-hidden="true" focusable="false"><use href="#ico-projects"></use></svg></template><template data-if="icon.isCv"><svg class="desk-icon__art" aria-hidden="true" focusable="false"><use href="#ico-cv"></use></svg></template><template data-if="icon.isContact"><svg class="desk-icon__art" aria-hidden="true" focusable="false"><use href="#ico-contact"></use></svg></template><template data-if="icon.isCode"><svg class="desk-icon__art" aria-hidden="true" focusable="false"><use href="#ico-code"></use></svg></template><template data-if="icon.isBin"><svg class="desk-icon__art" aria-hidden="true" focusable="false"><use href="#ico-bin"></use></svg></template><span class="desk-icon__label">{{icon.label}}</span></a></template>

<section class="{{filesCls}}" data-win="explorer" data-window="{{explorerState}}" data-style="{{explorerPlace}}" aria-label="Projects" data-on-pointerdown="explorerFront">
<div class="w95-win__bar" data-on-pointerdown="explorerDrag"><svg class="w95-win__icon" aria-hidden="true" focusable="false"><use href="#ico-projects"></use></svg><p class="w95-win__title">Projects</p><span class="w95-win__buttons">
<button class="w95-btn w95-btn--cap" type="button" aria-label="Minimise" data-on-click="minimiseExplorer"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 8h6v1H2z"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Maximise" data-on-click="maximiseExplorer"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1 1h8v8H1zM2 3v5h6V3z" fill-rule="evenodd"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Close" data-on-click="closeExplorer"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2l-6 6" stroke="#000" stroke-width="1.6"></path></svg></button>
</span></div>
<p class="w95-menu" aria-hidden="true"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>H</u>elp</span></p>
<p class="w95-address" aria-hidden="true"><span>Address</span><span class="w95-address__box"><svg focusable="false"><use href="#ico-projects"></use></svg>C:\Projects</span></p>
<div class="w95-files">
<p class="w95-files__head" aria-hidden="true"><span>Name</span><span>Built with</span><span>Year</span><span>Status</span></p>
<ol class="w95-files__list" role="list">
<template data-each="rows" data-as="row"><li class="{{row.cls}}"><a class="w95-file__link" href="{{row.href}}" data-on-click="row.pick" data-on-dblclick="row.open"><span class="w95-file__name"><svg aria-hidden="true" focusable="false"><use href="#ico-projects"></use></svg>{{row.title}}</span><span>{{row.lead}}</span><span>{{row.year}}</span><span>{{row.status}}</span></a></li></template>
</ol>
</div>
<p class="w95-status"><span>{{count}} object(s)</span><span>Double-click a project to open it</span></p>
</section>

<section class="{{aboutCls}}" data-win="about" data-window="{{aboutState}}" data-style="{{aboutPlace}}" aria-label="About this project" data-on-pointerdown="aboutFront">
<div class="w95-win__bar" data-on-pointerdown="aboutDrag"><svg class="w95-win__icon" aria-hidden="true" focusable="false"><use href="#ico-cv"></use></svg><p class="w95-win__title">{{cur.title}}</p><span class="w95-win__buttons">
<button class="w95-btn w95-btn--cap" type="button" aria-label="Minimise" data-on-click="minimiseAbout"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 8h6v1H2z"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Maximise" data-on-click="maximiseAbout"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1 1h8v8H1zM2 3v5h6V3z" fill-rule="evenodd"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Close" data-on-click="closeAbout"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2l-6 6" stroke="#000" stroke-width="1.6"></path></svg></button>
</span></div>
<div class="w95-about">
<div class="w95-about__screen screen screen--{{cur.screen}} screen--live">
<canvas class="screen__canvas live" data-ref="artRef" aria-hidden="true"></canvas>
{% endverbatim %}{% include "projects/includes/stills.html" with on="cur" %}{% verbatim %}
</div>
<p class="w95-about__title">{{cur.title}}</p>
<p>{{cur.summary}}</p>
<p class="w95-about__meta">Built with: {{cur.stack}}</p>
<p class="w95-about__meta">Role: {{cur.role}}</p>
<p class="w95-about__meta">When: {{cur.when}}</p>
<div class="w95-about__buttons">
<a class="w95-btn" href="{{cur.href}}">Read the case study</a>
<button class="w95-btn" type="button" data-on-click="next">Next &gt;</button>
</div>
</div>
</section>

<section class="{{cvCls}}" data-win="paper" data-window="{{cvState}}" data-style="{{cvPlace}}" aria-label="CV" data-on-pointerdown="cvFront">
<div class="w95-win__bar" data-on-pointerdown="cvDrag"><svg class="w95-win__icon" aria-hidden="true" focusable="false"><use href="#ico-cv"></use></svg><p class="w95-win__title">cv.doc - Document</p><span class="w95-win__buttons">
<button class="w95-btn w95-btn--cap" type="button" aria-label="Minimise" data-on-click="minimiseCv"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 8h6v1H2z"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Maximise" data-on-click="maximiseCv"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1 1h8v8H1zM2 3v5h6V3z" fill-rule="evenodd"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Close" data-on-click="closeCv"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2l-6 6" stroke="#000" stroke-width="1.6"></path></svg></button>
</span></div>
<p class="w95-menu" aria-hidden="true"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>I</u>nsert</span><span>F<u>o</u>rmat</span><span><u>H</u>elp</span></p>
<p class="w95-ruler" aria-hidden="true"></p>
<div class="w95-doc">
{% endverbatim %}{% include "projects/includes/paper.html" %}{% verbatim %}
</div>
<p class="w95-status"><span>Page 1 of 1</span><span><a href="{{cvUrl}}">Open the full CV</a></span></p>
</section>

<section class="{{contactCls}}" data-win="letter" data-window="{{contactState}}" data-style="{{contactPlace}}" aria-label="New message" data-on-pointerdown="contactFront">
<div class="w95-win__bar" data-on-pointerdown="contactDrag"><svg class="w95-win__icon" aria-hidden="true" focusable="false"><use href="#ico-contact"></use></svg><p class="w95-win__title">New Message</p><span class="w95-win__buttons">
<button class="w95-btn w95-btn--cap" type="button" aria-label="Minimise" data-on-click="minimiseContact"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 8h6v1H2z"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Maximise" data-on-click="maximiseContact"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1 1h8v8H1zM2 3v5h6V3z" fill-rule="evenodd"></path></svg></button>
<button class="w95-btn w95-btn--cap" type="button" aria-label="Close" data-on-click="closeContact"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2l-6 6" stroke="#000" stroke-width="1.6"></path></svg></button>
</span></div>
<p class="w95-menu" aria-hidden="true"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>H</u>elp</span></p>
<div class="mail mail--w95" data-mail data-busy="{{mailBusy}}">
<p class="mail__row"><span>To:</span><span class="mail__fixed">Dylan Fitzsimmons</span></p>
<label class="mail__row"><span>From:</span><input type="email" placeholder="your email address" autocomplete="off" spellcheck="false"></label>
<label class="mail__body"><span class="visually-hidden">Message</span><textarea placeholder="Type a message" autocomplete="off"></textarea></label>
<p class="mail__foot"><span class="mail__note" role="status">{{mailNote}}</span><button class="w95-btn" type="button" data-on-click="sendMail">Send</button></p>
</div>
<p class="w95-status"><span>{{mailStatus}}</span><span>Offline</span></p>
</section>

<template data-if="mailSending"><div class="w95-win w95-dialog is-active" role="status">
<div class="w95-win__bar"><p class="w95-win__title">Sending</p></div>
<div class="w95-dialog__body"><p>Dialling the Internet...</p><span class="w95-progress" aria-hidden="true"><i></i></span></div>
</div></template>
<template data-if="mailFailed"><div class="w95-win w95-dialog is-active" role="alertdialog" aria-label="Message not sent">
<div class="w95-win__bar"><p class="w95-win__title">Mail</p><span class="w95-win__buttons"><button class="w95-btn w95-btn--cap" type="button" aria-label="Close" data-on-click="closeMail"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2l-6 6" stroke="#000" stroke-width="1.6"></path></svg></button></span></div>
<div class="w95-dialog__body w95-dialog__body--error"><svg class="w95-dialog__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14" fill="#ff0000" stroke="#000"></circle><path d="M10 10l12 12M22 10 10 22" stroke="#fff" stroke-width="4"></path></svg><div>
<p><b>Your message could not be sent.</b></p>
<p>This computer is only a drawing and isn't connected to anything, so nothing you typed has left this page. To get in touch, use the contact page.</p>
</div></div>
<p class="w95-dialog__buttons"><a class="w95-btn" href="{{contactUrl}}">Contact page</a><button class="w95-btn" type="button" data-on-click="closeMail">OK</button></p>
</div></template>

<div class="w95-taskbar">
<button class="w95-btn w95-start" type="button" aria-expanded="{{startExpanded}}" data-on-click="toggleStart"><span class="w95-start__mark" aria-hidden="true">df</span>Start</button>
<template data-if="filesInBar"><button class="w95-btn w95-task" type="button" data-task="explorer" aria-pressed="{{explorerShown}}" data-on-click="taskExplorer"><svg aria-hidden="true" focusable="false"><use href="#ico-projects"></use></svg>Projects</button></template>
<template data-if="aboutInBar"><button class="w95-btn w95-task" type="button" data-task="about" aria-pressed="{{aboutShown}}" data-on-click="taskAbout"><svg aria-hidden="true" focusable="false"><use href="#ico-cv"></use></svg>{{cur.title}}</button></template>
<template data-if="cvInBar"><button class="w95-btn w95-task" type="button" data-task="paper" aria-pressed="{{cvShown}}" data-on-click="taskCv"><svg aria-hidden="true" focusable="false"><use href="#ico-cv"></use></svg>cv.doc</button></template>
<template data-if="contactInBar"><button class="w95-btn w95-task" type="button" data-task="letter" aria-pressed="{{contactShown}}" data-on-click="taskContact"><svg aria-hidden="true" focusable="false"><use href="#ico-contact"></use></svg>New Message</button></template>
<span class="w95-tray"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#000"></path><path d="M11 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="#000"></path></svg>{{clock}}</span>
</div>

<div class="w95-startmenu" data-open="{{startOpen}}">
<p class="w95-startmenu__band" aria-hidden="true"><b>DF</b>95</p>
<ul role="list">
<li><a href="{{homeUrl}}"><svg aria-hidden="true" focusable="false"><use href="#ico-home"></use></svg>Home</a></li>
<li><button type="button" data-on-click="openFiles"><svg aria-hidden="true" focusable="false"><use href="#ico-projects"></use></svg>Projects</button></li>
<li><a href="{{cvUrl}}"><svg aria-hidden="true" focusable="false"><use href="#ico-cv"></use></svg>CV</a></li>
<li><a href="{{contactUrl}}"><svg aria-hidden="true" focusable="false"><use href="#ico-contact"></use></svg>Contact</a></li>
<li class="w95-startmenu__rule"><button type="button" data-on-click="startSaver"><svg aria-hidden="true" focusable="false"><use href="#ico-saver"></use></svg>Screen saver</button></li>
<li><button type="button" data-on-click="shutDown"><svg aria-hidden="true" focusable="false"><use href="#ico-off"></use></svg>Shut Down...</button></li>
</ul>
</div>
<p class="w95-tip" data-shown="{{balloonShown}}" role="status">{{balloon}}</p>
<template data-if="stripOn"><p class="w95-strip" data-way="{{stripWay}}" data-style="{{stripStyle}}" aria-hidden="true">{{stripTitle}}</p></template>
<template data-if="saverOn"><canvas class="w95-saver" data-ref="saverRef" aria-hidden="true"></canvas></template>
<template data-if="safeOn"><p class="w95-safe" role="status">You can now switch off<br>your computer.</p></template>
</div>
</div>
<div class="boot boot--w95" data-shown="{{bootShown}}" aria-hidden="true"><p class="boot95__name">df<b>95</b></p><span class="boot95__bar"><i></i></span><p class="boot95__note">Starting up...</p></div>
</div>
</div>
<div class="osd-menu" data-open="{{menuOpen}}">
<p class="osd-menu__title">{{menuTitle}}</p>
<template data-each="menuRows" data-as="row"><div class="{{row.cls}}" data-hidden="row.hidden"><span>{{row.label}}</span><span class="osd-menu__track" data-on-pointerdown="row.grab"><i data-style="{{row.bar}}"></i></span><span class="osd-menu__value">{{row.value}}</span></div></template>
<template data-if="menuFull"><button class="osd-menu__exit" type="button" data-on-click="closeMenu">Exit</button></template>
</div>
<span class="pm__glare" aria-hidden="true"><img src="{{images.crtGlare}}" alt="" draggable="false"></span>
</div>
<button class="pm__button pm__button--brightness" type="button" aria-label="Brightness" data-on-click="openBrightness"></button><button class="pm__button pm__button--contrast" type="button" aria-label="Contrast" data-on-click="openContrast"></button><button class="pm__button pm__button--menu" type="button" aria-label="Monitor menu" data-on-click="openMenu"></button><button class="pm__button pm__button--round pm__button--power" type="button" aria-label="{{powerLabel}}" data-on-click="togglePower"></button><span class="pm__led" aria-hidden="true"></span>
</div>
<svg class="pm__stand" viewBox="0 0 1000 250" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="stand-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c4a4a"></stop><stop offset="1" stop-color="#0b1c26"></stop></linearGradient>
<linearGradient id="stand-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d2530"></stop><stop offset="0.5" stop-color="#2a6b63"></stop><stop offset="1" stop-color="#0d2530"></stop></linearGradient>
<radialGradient id="stand-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8df2bd" stop-opacity="0.5"></stop><stop offset="1" stop-color="#8df2bd" stop-opacity="0"></stop></radialGradient>
</defs>
<ellipse class="pm__stand-glow" cx="500" cy="226" rx="470" ry="26" fill="url(#stand-glow)"></ellipse>
<path d="M352 0h296l34 96H318z" fill="url(#stand-b)"></path>
<path class="pm__stand-line" d="M410 22h180M400 44h200M390 66h220"></path>
<path d="M300 96h400c20 0 30 8 44 22l96 62H160l96-62c14-14 24-22 44-22z" fill="url(#stand-a)"></path>
<path class="pm__stand-line" d="M330 122h340M286 150h428"></path>
<path d="M150 180h700a16 16 0 0 1 16 16v18a14 14 0 0 1-14 14H148a14 14 0 0 1-14-14v-18a16 16 0 0 1 16-16z" fill="url(#stand-b)"></path>
<path class="pm__stand-accent" d="M190 204h620"></path>
<circle class="pm__stand-dot" cx="500" cy="204" r="6"></circle>
</svg>
</div>
</template>
<template data-if="isGreen">
<div class="pm pm--term pm--tube" data-power="{{power}}" data-signal="{{signal}}" data-style="{{levels}}">
<div class="pm__body">
<img class="pm__photo" src="{{images.term}}" alt="" width="1126" height="1066" draggable="false">
<div class="pm__screen tube">
<div class="pm__picture">
<div class="pm__level">
<div class="pm__jolt">
<section class="commander commander--crt" aria-label="Project browser">
<p class="commander__titlebar" aria-hidden="true"><span>Project Manager 1.0</span><span>{{clock}}</span></p>
<div class="commander__panes">
<div class="commander__pane">
<p class="commander__pane-title">~/projects</p>
<p class="commander__cols" aria-hidden="true"><span>Name</span><span>Stack</span><span>Year</span><span>State</span></p>
<ol class="commander__list" role="list">
<li class="commander__row"><a class="commander__link" href="{{homeUrl}}"><span class="commander__name">..</span><span class="commander__stack">&lt;up-dir&gt;</span><span class="commander__year"></span><span class="commander__status"></span></a></li>
<template data-each="rows" data-as="row"><li class="{{row.cls}}"><a class="commander__link" href="{{row.href}}" data-on-click="row.pick"><span class="commander__name">{{row.slug}}</span><span class="commander__stack">{{row.lead}}</span><span class="commander__year">{{row.year}}</span><span class="commander__status">{{row.code}}</span></a></li></template>
</ol>
<dl class="commander__info">
<div><dt>projects</dt><dd>{{count}}</dd></div>
<div><dt>in progress</dt><dd>{{liveCount}}</dd></div>
<div><dt>tools used</dt><dd>{{toolCount}}</dd></div>
<div><dt>newest</dt><dd>{{newest}}</dd></div>
</dl>
</div>
<div class="commander__pane commander__readme">
<p class="commander__pane-title">{{cur.slug}}/readme.txt</p>
<div class="commander__preview screen screen--{{cur.screen}} screen--live">
<canvas class="screen__canvas live" data-ref="artRef" aria-hidden="true"></canvas>
{% endverbatim %}{% include "projects/includes/stills.html" with on="cur" %}{% verbatim %}
</div>
<div class="commander__text" tabindex="0" role="group" aria-label="About this project">
<p>{{cur.title}}</p>
<p class="commander__dim">{{cur.summary}}</p>
<p><span class="commander__dim">built with:</span> {{cur.stack}}</p>
<p><span class="commander__dim">role:</span> {{cur.role}}</p>
<p><span class="commander__dim">when:</span> {{cur.when}}</p>
</div>
</div>
</div>
<p class="commander__prompt" aria-hidden="true">C:\PROJECTS&gt; <span class="commander__cursor"></span></p>
<div class="commander__keys">
<a class="key-btn" href="{{cur.href}}"><span>F3</span><span class="key-btn__label">read</span></a>
<a class="key-btn" href="#"><span>F4</span><span class="key-btn__label">code</span></a>
<a class="key-btn" href="{{homeUrl}}"><span>F10</span><span class="key-btn__label">home</span></a>
</div>
</section>
</div>
<div class="boot boot--crt" data-shown="{{bootShown}}" aria-hidden="true"><template data-each="bootLines" data-as="line"><p class="{{line.cls}}">{{line.text}}</p></template><span class="boot__cursor"></span></div>
</div>
</div>
<span class="pm__roll" aria-hidden="true"></span>
<span class="pm__glare" aria-hidden="true"><img src="{{images.termGlare}}" alt="" draggable="false"></span>
</div>
<button class="pm__button pm__button--power" type="button" aria-label="{{powerLabel}}" data-on-click="togglePower"></button><button class="pm__dial pm__dial--brightness" type="button" aria-label="Brightness: hold and drag" data-held="{{brightHeld}}" data-on-pointerdown="dialBrightness"><i data-style="{{brightTurn}}"></i></button><button class="pm__dial pm__dial--contrast" type="button" aria-label="Contrast: hold and drag" data-held="{{contrastHeld}}" data-on-pointerdown="dialContrast"><i data-style="{{contrastTurn}}"></i></button><span class="pm__led" aria-hidden="true"></span>
</div>

</div>
</template>
<template data-if="isGlass">
<div class="pm pm--lcd " data-power="{{power}}" data-signal="{{signal}}" data-style="{{levels}}">
<div class="pm__body">
<img class="pm__photo" src="{{images.lcd}}" alt="" width="1357" height="871" draggable="false">
<div class="pm__screen ">
<div class="pm__picture">
<div class="pm__level">
<div class="pm__jolt">
<div class="aero aero--aurora">
<svg class="visually-hidden" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="g-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9d5c"></stop><stop offset="1" stop-color="#c9431d"></stop></linearGradient>

<a class="aero-button" href="{{cur.href}}">Read the case study</a>
</div>
</div>
</div>
</section>

<section class="glass glass--dark viewer" data-win="viewer" data-moving="{{viewerMoving}}" data-window="{{viewerState}}" data-style="{{viewerPlace}}" aria-label="Preview" data-on-pointerdown="viewerFront">
<div class="glass__bar" data-on-pointerdown="viewerDrag">
<span class="glass__icon glass__icon--media" aria-hidden="true"></span>
<p class="glass__title">{{cur.title}} – preview</p>
<div class="glass__buttons">
<button class="glass-btn" type="button" aria-label="Minimise" data-on-click="minimiseViewer"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 7.5h6"></path></svg></button>
<button class="glass-btn" type="button" aria-label="Maximise" data-on-click="maximiseViewer"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2.5h6v5H2z"></path></svg></button>
<button class="glass-btn glass-btn--close" type="button" aria-label="Close" data-on-click="closeViewer"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"></path></svg></button>
</div>
</div>
<div class="glass__body viewer__body">
<div class="viewer__screen screen screen--{{cur.screen}} screen--live">
<canvas class="screen__canvas live" data-ref="artRef" aria-hidden="true"></canvas>
{% endverbatim %}{% include "projects/includes/stills.html" with on="cur" %}{% verbatim %}
</div>
<div class="viewer__controls">
<div class="viewer__buttons">
<button class="orb-btn" type="button" aria-label="Previous project" data-on-click="prev"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5"></path></svg></button>
<a class="orb-btn viewer__play" href="{{cur.href}}" aria-label="Read the case study"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5.5 3.5v9l7-4.5z"></path></svg></a>
<button class="orb-btn" type="button" aria-label="Next project" data-on-click="next"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5"></path></svg></button>
</div>
</div>
</div>
</section>

<section class="glass docwin" data-win="paper" data-moving="{{cvMoving}}" data-window="{{cvState}}" data-style="{{cvPlace}}" aria-label="CV" data-on-pointerdown="cvFront">
<div class="glass__bar" data-on-pointerdown="cvDrag">
<span class="glass__icon glass__icon--doc" aria-hidden="true"></span>
<p class="glass__title">CV – Document</p>
<div class="glass__buttons">
<button class="glass-btn" type="button" aria-label="Minimise" data-on-click="minimiseCv"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 7.5h6"></path></svg></button>
<button class="glass-btn" type="button" aria-label="Maximise" data-on-click="maximiseCv"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2.5h6v5H2z"></path></svg></button>
<button class="glass-btn glass-btn--close" type="button" aria-label="Close" data-on-click="closeCv"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"></path></svg></button>
</div>
</div>
<div class="glass__body docwin__body">
<p class="commands"><a class="commands__item" href="{{cvUrl}}">Open the full CV</a><span class="commands__item" aria-hidden="true">Page 1 of 1</span></p>
<div class="docwin__desk">
{% endverbatim %}{% include "projects/includes/paper.html" %}{% verbatim %}
</div>
</div>
</section>

<section class="glass mailwin" data-win="letter" data-moving="{{contactMoving}}" data-window="{{contactState}}" data-style="{{contactPlace}}" aria-label="New message" data-on-pointerdown="contactFront">
<div class="glass__bar" data-on-pointerdown="contactDrag">
<span class="glass__icon glass__icon--mail" aria-hidden="true"></span>
<p class="glass__title">New message</p>
<div class="glass__buttons">
<button class="glass-btn" type="button" aria-label="Minimise" data-on-click="minimiseContact"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 7.5h6"></path></svg></button>
<button class="glass-btn" type="button" aria-label="Maximise" data-on-click="maximiseContact"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2.5h6v5H2z"></path></svg></button>
<button class="glass-btn glass-btn--close" type="button" aria-label="Close" data-on-click="closeContact"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"></path></svg></button>
</div>
</div>
<div class="glass__body">
<div class="mail mail--aero" data-mail data-busy="{{mailBusy}}">
<p class="mail__row"><span>To:</span><span class="mail__fixed">Dylan Fitzsimmons</span></p>
<label class="mail__row"><span>From:</span><input type="email" placeholder="your email address" autocomplete="off" spellcheck="false"></label>
<label class="mail__body"><span class="visually-hidden">Message</span><textarea placeholder="Type a message" autocomplete="off"></textarea></label>
<p class="mail__foot"><span class="mail__note" role="status">{{mailNote}}</span><span class="mail__offline">Working offline</span><button class="aero-btn" type="button" data-on-click="sendMail">Send</button></p>
</div>
</div>
</section>

<template data-if="mailSending"><div class="glass aero-dialog" role="status">
<div class="glass__bar"><p class="glass__title">Sending</p></div>
<div class="glass__body aero-dialog__body"><p>Connecting...</p><span class="aero-progress" aria-hidden="true"><i></i></span></div>
</div></template>
<template data-if="mailFailed"><div class="glass aero-dialog" role="alertdialog" aria-label="Message not sent">
<div class="glass__bar"><p class="glass__title">Mail</p></div>
<div class="glass__body aero-dialog__body">
<div class="aero-dialog__text"><span class="aero-dialog__mark" aria-hidden="true">!</span><div>
<p><b>Your message could not be sent.</b></p>
<p>This computer is only a drawing and isn't connected to anything, so nothing you typed has left this page. To get in touch, use the contact page.</p>
</div></div>
<p class="aero-dialog__buttons"><a class="aero-btn" href="{{contactUrl}}">Contact page</a><button class="aero-btn" type="button" data-on-click="closeMail">OK</button></p>
</div>
</div></template>

<section class="media" data-style="{{mediaPlace}}" aria-label="Music player" data-on-pointerdown="mediaDrag">
<div class="media__inner">
<button class="orb-btn media__play" type="button" aria-label="{{playLabel}}" aria-pressed="{{playing}}" data-on-click="togglePlay"><template data-if="isPlaying"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5.5 4v8M10.5 4v8"></path></svg></template><template data-if="isPaused"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5.5 3.5v9l7-4.5z"></path></svg></template></button>
<p class="media__title">aero-afternoon.mp3</p>
<span class="media__track" aria-hidden="true"><span data-style="{{playedPercent}}"></span></span>
<p class="media__time"><span>{{playedText}}</span><span>320 kbps</span></p>
<svg class="media__speaker" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"></path><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8"></path></svg>
</div>
</section>
