{% verbatim %}<section class="iv-panel"><header class="iv-panel__head"><h2 class="iv-panel__title">Stress test</h2><template data-if="scenariosChanged"><button class="iv-chip" type="button" data-on-click="resetScenarios">Reset to the rationale's figures</button></template></header>
<ul class="iv-scenarios iv-scenarios--live" role="list"><template data-each="scenarios" data-as="s"><li><label class="iv-scenarios__label" for="iv-sc-{{s.key}}">{{s.label}} <b class="{{s.moveCls}}">{{s.move}}</b></label><input class="iv-scenarios__range" id="iv-sc-{{s.key}}" type="range" min="{{s.min}}" max="{{s.max}}" step="1" value="{{s.value}}" data-on-input="s.onMove"><span class="iv-num {{s.cls}}">{{s.total}}</span><span class="iv-scenarios__who">{{s.holdings}}</span></li></template></ul>
<p class="iv-note">Each move on its own, at the weights on {{asOf}}, with everything else held still. Defensive equities still count as shares, and a stronger pound would lower the value of overseas holdings on top.</p>
<template data-if="sliders"><h3 class="iv-subhead">World shares and chips</h3><div class="iv-chips" role="group" aria-label="Examples"><template data-each="presets" data-as="p"><button class="iv-chip" type="button" data-on-click="p.pick">{{p.label}}</button></template></div>
<div class="iv-controls iv-controls--stress"><label class="iv-range"><span>World shares move <b>{{shockLabel}}</b></span><input type="range" min="-50" max="30" step="1" value="{{shock}}" data-on-input="onShock"></label><label class="iv-range"><span>Chips beyond that <b>{{chipsLabel}}</b></span><input type="range" min="-30" max="20" step="1" value="{{chipsShock}}" data-on-input="onChips"></label></div>
<p class="iv-stress__total {{sliders.cls}}">Portfolio <b>{{sliders.total}}</b></p>
<ul class="iv-stress" role="list"><template data-each="sliders.rows" data-as="s"><li><span class="iv-stress__name">{{s.ticker}}</span><svg class="iv-bars__track" width="100%" height="8" aria-hidden="true"><rect class="{{s.fill}}" data-set-width="{{s.bar}}" height="8" rx="2"></rect></svg><span class="iv-num {{s.cls}}">{{s.move}}</span><span class="iv-num iv-stress__contrib">{{s.contrib}}</span></li></template></ul>
<p class="iv-note">Each holding's sensitivity to world shares, and beyond that to chips, measured over up to a year. An estimate: real crashes break these relationships.</p></template>
<template data-if="slidersWait"><p class="iv-note iv-note--wait">{{slidersWait}}</p></template></section>{% endverbatim %}
