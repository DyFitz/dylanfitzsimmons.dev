{% verbatim %}<div class="iv-scrub"><label class="iv-scrub__label" for="iv-scrub">Time machine <b>{{scrubLabel}}</b></label><input class="iv-scrub__range" id="iv-scrub" type="range" min="{{atMin}}" max="{{atMax}}" value="{{at}}" data-on-input="onScrub"><span class="iv-scrub__ends"><span>{{scrubFrom}}</span><span>{{scrubTo}}</span></span><template data-if="notLatest"><button class="iv-chip" type="button" data-on-click="latest">Back to latest</button></template></div>{% endverbatim %}
