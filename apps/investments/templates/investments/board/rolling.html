{% verbatim %}<section class="iv-panel"><header class="iv-panel__head"><h2 class="iv-panel__title">Rolling 3 months</h2></header>
<template data-if="rolling"><svg class="iv-mini" viewBox="0 0 1000 120" preserveAspectRatio="none" role="img" aria-label="Volatility and beta over a moving three-month window"><path class="iv-line iv-line--vol" data-set-d="{{rolling.vol}}"></path><path class="iv-line iv-line--beta" data-set-d="{{rolling.beta}}"></path></svg>
<p class="iv-note"><span class="iv-dot iv-dot--vol"></span>volatility {{rolling.volNow}} <span class="iv-dot iv-dot--beta"></span>beta to the {{benchCode}} {{rolling.betaNow}}</p></template>
<template data-if="rollingWait"><div class="iv-wait"><b>Not enough history yet</b><span>{{rollingWait.text}}</span><svg class="iv-wait__bar" width="100%" height="6" aria-hidden="true"><rect class="iv-wait__track" width="100%" height="6" rx="3"></rect><rect class="iv-fill--port" data-set-width="{{rollingWait.bar}}" height="6" rx="3"></rect></svg></div></template></section>{% endverbatim %}
