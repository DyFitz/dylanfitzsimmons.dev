{% verbatim %}<section class="iv-panel"><header class="iv-panel__head"><h2 class="iv-panel__title">Monte Carlo · {{mcYearsLabel}} ahead</h2></header>
<template data-if="mc"><div class="iv-mc"><svg class="iv-chart__svg" viewBox="0 0 1000 300" preserveAspectRatio="none" role="img" aria-label="The range of outcomes across the projected futures"><path class="iv-mc__outer" data-set-d="{{mc.outer}}"></path><path class="iv-mc__inner" data-set-d="{{mc.inner}}"></path><template data-each="mc.samples" data-as="s"><path class="iv-mc__sample" data-set-d="{{s}}"></path></template><path class="iv-mc__median" data-set-d="{{mc.median}}"></path></svg></div>
<div class="iv-controls"><label class="iv-range"><span>Years ahead <b>{{mcYearsLabel}}</b></span><input type="range" min="1" max="10" step="1" value="{{mcYears}}" data-on-input="onYears"></label><button class="iv-chip" type="button" data-on-click="rerun">Run again</button></div>
<dl class="iv-outcomes"><div><dt>Median</dt><dd>{{mc.medianText}}</dd></div><div><dt>1 in 20 worse than</dt><dd>{{mc.lowText}}</dd></div><div><dt>1 in 20 better than</dt><dd>{{mc.highText}}</dd></div><div><dt>Chance of a loss</dt><dd>{{mc.lossText}}</dd></div></dl>
<p class="iv-note">500 futures built from blocks of ten real days of this portfolio's history. It assumes the future looks like the past, which it won't.</p></template>
<template data-if="mcWait"><div class="iv-wait"><b>Not enough history yet</b><span>{{mcWait.text}}</span><svg class="iv-wait__bar" width="100%" height="6" aria-hidden="true"><rect class="iv-wait__track" width="100%" height="6" rx="3"></rect><rect class="iv-fill--port" data-set-width="{{mcWait.bar}}" height="6" rx="3"></rect></svg></div></template></section>{% endverbatim %}
