{% verbatim %}<section class="iv-panel"><header class="iv-panel__head"><h2 class="iv-panel__title">Where the return came from · {{periodLabel}}</h2><div class="iv-chips" role="group" aria-label="Group by"><template data-each="contribBy" data-as="c"><button class="{{c.cls}}" type="button" aria-pressed="{{c.pressed}}" data-on-click="c.pick">{{c.label}}</button></template></div></header>
<ul class="iv-ct" role="list"><template data-each="contribRows" data-as="c"><li><span class="iv-ct__name">{{c.name}}</span><svg class="iv-ct__track" width="100%" height="8" aria-hidden="true"><line x1="50%" x2="50%" y1="0" y2="8"></line><rect class="{{c.fill}}" data-set-x="{{c.x}}" data-set-width="{{c.w}}" height="8" rx="2"></rect></svg><span class="iv-num {{c.cls}}">{{c.text}}</span></li></template></ul>
<p class="iv-note">Points of the portfolio's return each one supplied, dividends included. They add up to {{contribTotal}}, the return over the period.</p></section>{% endverbatim %}
