{% verbatim %}<section class="iv-panel"><header class="iv-panel__head"><h2 class="iv-panel__title">By {{allocLabel}}</h2><div class="iv-chips" role="group" aria-label="Group by"><template data-each="allocBy" data-as="a"><button class="{{a.cls}}" type="button" aria-pressed="{{a.pressed}}" data-on-click="a.pick">{{a.label}}</button></template></div></header>
<ul class="iv-bars" role="list"><template data-each="allocRows" data-as="a"><li><span class="iv-bars__name">{{a.name}}</span><svg class="iv-bars__track" width="100%" height="10" aria-hidden="true"><rect class="iv-fill--port" y="1" data-set-width="{{a.bar}}" height="8" rx="2"></rect><line class="iv-target" data-set-x1="{{a.mark}}" data-set-x2="{{a.mark}}" y1="0" y2="10" data-hidden="a.noTarget"></line></svg><span class="iv-num">{{a.weight}} <span class="iv-dim">{{a.target}}</span></span><span class="iv-num {{a.cls}}">{{a.ret}}</span></li></template></ul>
<p class="iv-note"><template data-if="allocTargets"><span class="iv-tick"></span>target · </template>{{assetMix}}<br>top 5 holdings {{top5}} · effective number of holdings {{effective}}</p></section>{% endverbatim %}
