{% verbatim %}<section class="iv-panel iv-panel--bands"><header class="iv-panel__head"><h2 class="iv-panel__title">Weights over time</h2><span class="iv-hint">point at it to read off a day</span></header>
<div class="iv-bandchart" tabindex="0" role="group" aria-label="Weights over time. Point at it, or use the left and right arrow keys, to read off each sleeve's weight on a day." data-on-pointermove="onBandsMove" data-on-pointerleave="onBandsLeave" data-on-blur="onBandsLeave" data-on-keydown="onBandsKey">
<svg class="iv-bands" viewBox="0 0 1000 200" preserveAspectRatio="none" role="img" aria-label="Each sleeve's share of the portfolio over time"><g class="iv-bands__group"><template data-each="bands" data-as="b"><path class="iv-band iv-band--{{b.key}}" data-band="{{b.key}}" data-set-d="{{b.d}}" data-on-pointerenter="onBandFocus" data-on-pointerleave="onBandBlur"></path></template></g></svg>
<div class="iv-cross iv-cross--bands" hidden><span class="iv-cross__line"></span><div class="iv-cross__tip"></div></div>
</div>
<div class="iv-chart__x" aria-hidden="true"><span>{{bandsFrom}}</span><span>{{bandsTo}}</span></div>
<ul class="iv-legend iv-legend--bands" role="list"><template data-each="bands" data-as="b"><li><button class="iv-legend__key" type="button" data-band="{{b.key}}" aria-label="Highlight {{b.name}}: {{b.now}} against a target of {{b.target}}" data-on-pointerenter="onBandFocus" data-on-pointerleave="onBandBlur" data-on-focus="onBandFocus" data-on-blur="onBandBlur"><span class="iv-dot iv-dot--{{b.key}}"></span>{{b.name}} <b>{{b.now}}</b> <span class="iv-dim">/ {{b.target}}</span></button></li></template></ul>
<p class="iv-note">Weights drift as prices move, and are reset to their targets at the end of each quarter.</p></section>{% endverbatim %}
