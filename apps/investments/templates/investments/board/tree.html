{% verbatim %}<section class="iv-panel"><header class="iv-panel__head"><h2 class="iv-panel__title">{{treeTitle}}</h2><template data-if="drilled"><button class="iv-chip" type="button" data-on-click="undrill">◂ All sectors</button></template><span class="iv-hint">{{treeHint}}</span></header>
<div class="iv-tree iv-tree--live" data-ref="treeRef"><template data-each="treeBoxes" data-as="t"><button class="iv-tbox {{t.cls}}" type="button" title="{{t.full}}" aria-label="{{t.full}}" data-style="left: {{t.x}}; top: {{t.y}}; width: {{t.w}}; height: {{t.h}}" data-on-click="t.pick"><span class="iv-tbox__name">{{t.name}}</span><span class="iv-tbox__meta" data-hidden="t.small">{{t.meta}}</span></button></template></div></section>{% endverbatim %}
