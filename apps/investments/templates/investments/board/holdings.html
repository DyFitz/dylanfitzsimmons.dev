{% verbatim %}<section class="iv-panel iv-panel--wide"><header class="iv-panel__head"><h2 class="iv-panel__title">Holdings · as of {{asOf}}</h2><template data-if="drilled"><button class="iv-chip" type="button" data-on-click="undrill">◂ {{drillName}} · show all</button></template><span class="iv-hint">click a row to see its sector</span></header><div class="iv-scroll"><table class="iv-table iv-table--hold iv-table--live">
<thead><tr><th scope="col">Holding</th><th scope="col">Sector</th><th scope="col">Weight</th><th scope="col">1D</th><th scope="col">1M</th><th scope="col">YTD</th><th scope="col">{{periodLabel}}</th><th scope="col">Beta</th><th scope="col">Vol</th><th scope="col">Risk share</th></tr></thead>
<tbody><template data-each="holdingsRows" data-as="h"><tr data-on-click="h.pick"><th scope="row"><b>{{h.ticker}}</b> <span>{{h.name}}</span></th><td>{{h.sector}}</td><td class="iv-num"><svg class="iv-wbar" width="48" height="6" aria-hidden="true"><rect data-set-width="{{h.bar}}" height="6" rx="2"></rect></svg>{{h.weight}}</td><template data-each="h.cells" data-as="c"><td class="iv-num {{c.cls}}">{{c.text}}</td></template><td class="iv-num">{{h.beta}}</td><td class="iv-num">{{h.vol}}</td><td class="iv-num">{{h.risk}}</td></tr></template>
<template data-if="showCash"><tr><th scope="row"><b>Cash</b></th><td>Cash</td><td class="iv-num">{{cashWeight}}</td><td colspan="7"></td></tr></template></tbody>
</table></div></section>{% endverbatim %}
